<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFFI 57 Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fa; --surface:#ffffff; --surface2:#e9ebf5; --ink:#1b1f4b; --ink2:#5b5f86; --line:#dcdfee;
  --blue:#3a4fa0; --pink:#e5007e; --warn:#b45309; --bad:#c81e3a;
  --a-panjim:#3a4fa0; --a-porvorim:#108a55; --a-margao:#c8302a; --a-ponda:#7a3db0; --a-north:#b98500;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1030; --surface:#181b44; --surface2:#23275a; --ink:#eef0fb; --ink2:#a5a9d0; --line:#2d3168;
  --blue:#8ea0ff; --pink:#ff4fa7; --warn:#f2b84b; --bad:#ff6b81;
  --a-panjim:#8ea0ff; --a-porvorim:#4fd394; --a-margao:#ff7a6e; --a-ponda:#c592ff; --a-north:#f2c94c;
  color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1030; --surface:#181b44; --surface2:#23275a; --ink:#eef0fb; --ink2:#a5a9d0; --line:#2d3168;
  --blue:#8ea0ff; --pink:#ff4fa7; --warn:#f2b84b; --bad:#ff6b81;
  --a-panjim:#8ea0ff; --a-porvorim:#4fd394; --a-margao:#ff7a6e; --a-ponda:#c592ff; --a-north:#f2c94c;
  color-scheme: dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.45 var(--text); -webkit-font-smoothing:antialiased; padding-bottom:84px; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button{ font:inherit; color:inherit; cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; border-radius:6px; }
h1,h2,h3{ margin:0; }
.wrap{ max-width:760px; margin:0 auto; padding:0 16px; }

/* header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:14px 0 10px; }
.brand{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.brand h1{ font:800 30px/0.95 var(--display); letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
.brand h1 svg{ width:22px; height:22px; }
.brand p{ margin:4px 0 0; color:var(--ink2); font-size:13px; }
.guidebtn{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; white-space:nowrap; }

/* day strip */
.days{ display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px; margin:0 -16px; scrollbar-width:none; }
.days::-webkit-scrollbar{ display:none; }
.day{ flex:0 0 auto; min-width:62px; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:7px 8px 8px; display:flex; flex-direction:column; align-items:center; }
.day .dw{ font-size:11px; color:var(--ink2); }
.day .dn{ font:800 24px/1.05 var(--display); }
.day .dc{ font-size:10.5px; color:var(--ink2); white-space:nowrap; }
.day.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
.day.on .dw,.day.on .dc{ color:rgba(255,255,255,.8); }

.ctrls{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.chips{ display:flex; gap:6px; overflow-x:auto; margin:0 -16px; padding:0 16px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:0 0 auto; border:1px solid var(--line); background:transparent; border-radius:999px; padding:5px 11px; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
.chip i{ width:8px; height:8px; border-radius:50%; background:var(--dot); }
.chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.seg{ display:inline-flex; background:var(--surface2); border-radius:10px; padding:3px; }
.seg button{ border:0; background:transparent; padding:5px 12px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink2); }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,24,70,.12); }
.sumrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:14px 0 4px; }
.daysum{ font-size:13px; color:var(--ink2); display:flex; flex-wrap:wrap; gap:4px 12px; }
.daysum b{ color:var(--ink); font:700 16px/1.2 var(--display); width:100%; }

/* blocks & cards */
.block{ margin-top:18px; }
.bh{ font:700 19px/1.2 var(--display); display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.bh span{ font:500 12.5px var(--text); color:var(--ink2); }
.card{ position:relative; display:flex; gap:12px; background:var(--surface); border-radius:16px; padding:12px 44px 12px 12px; margin-bottom:8px; border:1px solid var(--line); }
.card.film{ cursor:pointer; }
.card.past{ opacity:.5; }
.tcol{ flex:0 0 42px; display:flex; flex-direction:column; align-items:flex-start; padding-top:1px; }
.tcol b{ font:800 19px/1 var(--display); }
.tcol span{ font-size:11px; color:var(--ink2); margin-top:2px; }
.body{ min-width:0; flex:1; }
.body h3{ font:700 16px/1.2 var(--display); letter-spacing:-0.005em; }
.body h3.multi{ font-size:15px; display:flex; justify-content:space-between; gap:8px; padding:3px 0; cursor:pointer; }
.body h3.multi + h3.multi{ border-top:1px dashed var(--line); }
.body h3.multi small{ font:500 12px var(--text); color:var(--ink2); white-space:nowrap; }
.kind{ font-size:12px; color:var(--ink2); margin-bottom:2px; display:flex; gap:8px; align-items:center; }
.live{ font-style:normal; background:var(--pink); color:#fff; border-radius:999px; padding:1px 7px; font-size:11px; font-weight:600; }
.meta{ margin:3px 0 0; font-size:13px; color:var(--ink2); display:flex; flex-wrap:wrap; gap:2px 10px; }
.meta span:empty{ display:none; }
.meta.big{ font-size:14px; }
.row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:8px; }
.ven{ --ac:var(--a-panjim); font-size:12px; font-weight:600; color:var(--ac); background:color-mix(in srgb, var(--ac) 12%, transparent); border-radius:6px; padding:2px 7px; white-space:nowrap; }
.ven[data-area="porvorim"]{ --ac:var(--a-porvorim); } .ven[data-area="margao"]{ --ac:var(--a-margao); }
.ven[data-area="ponda"]{ --ac:var(--a-ponda); } .ven[data-area="north"]{ --ac:var(--a-north); }
.dur{ font-size:12px; color:var(--ink2); }
.secs{ display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:6px; }
.dotl{ font-size:11.5px; color:var(--ink2); display:inline-flex; align-items:center; gap:5px; }
.dotl::before{ content:""; width:7px; height:7px; border-radius:2px; background:var(--c); transform:rotate(45deg); }
.pin{ position:absolute; top:8px; right:8px; width:34px; height:34px; border:0; background:transparent; border-radius:50%; display:grid; place-items:center; }
.pin svg{ width:20px; height:20px; overflow:visible; }
.pin svg path{ stroke:var(--ink2); stroke-width:2.2; }
.pin.on svg path{ stroke:var(--pink); }
.card.talk{ border-left:4px solid var(--ink); }
.card.event{ border-left:4px solid var(--pink); }
.empty{ color:var(--ink2); padding:30px 4px; text-align:center; }
.lede{ color:var(--ink2); font-size:14px; margin:6px 0 10px; max-width:60ch; }

/* generated posters */
.poster{ position:relative; overflow:hidden; flex:0 0 auto; color:#fff; border-radius:10px;
  background: radial-gradient(120% 90% at 85% 0%, hsl(var(--ph) 70% 55% / .55), transparent 60%), linear-gradient(165deg, var(--pc), color-mix(in srgb, var(--pc) 45%, #0b0d2a)); }
.pstar{ position:absolute; transform:translate(-50%,-50%); aspect-ratio:1; }
.pstar svg{ width:100%; height:100%; display:block; }
.ptitle{ position:absolute; left:8%; right:8%; bottom:8%; font-family:var(--display); font-weight:800; line-height:.95; letter-spacing:-0.01em; text-transform:uppercase; overflow-wrap:anywhere; }
.poster.sm{ width:46px; height:62px; border-radius:7px; }
.poster.sm .ptitle{ font-size:8px !important; left:7%; right:7%; bottom:7%; }
.poster.md{ width:100%; aspect-ratio:2/3; }
.poster.lg{ width:150px; aspect-ratio:2/3; border-radius:14px; box-shadow:0 10px 30px -12px color-mix(in srgb, var(--pc) 70%, transparent); }
.poster.lg .ptitle{ bottom:16%; }
.pmeta{ position:absolute; left:8%; right:8%; bottom:6%; font-size:10px; opacity:.85; }

/* timeline */
.hint{ font-size:12.5px; color:var(--ink2); margin:12px 0 8px; }
.tl{ margin:0 -16px; }
.tlscroll{ overflow-x:auto; overscroll-behavior-x:contain; padding:0 16px 10px; }
.thead,.trow{ display:flex; }
.tlab{ flex:0 0 96px; position:sticky; left:-16px; z-index:2; background:var(--bg); padding:6px 8px 6px 0; display:flex; flex-direction:column; justify-content:center; }
.tlab b{ font:700 12.5px/1.15 var(--display); }
.tlab span{ font-size:10.5px; color:var(--ink2); }
.hours{ position:relative; height:22px; border-bottom:1px solid var(--line); }
.hours span{ position:absolute; top:2px; font-size:11px; color:var(--ink2); transform:translateX(-50%); }
.tbody{ position:relative; }
.tlane{ position:relative; height:58px; border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 90px); }
.blk{ position:absolute; top:6px; height:46px; border:0; border-radius:8px; background:var(--c); color:#fff; text-align:left; padding:4px 7px; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
.blk b{ font:700 11.5px/1.15 var(--display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk span{ font-size:10px; opacity:.85; }
.blk.on{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--pink); }
.blk.talk{ background:var(--ink); color:var(--bg); }
.nowwrap{ position:absolute; top:0; bottom:0; left:96px; pointer-events:none; }
.nowline{ position:absolute; top:0; bottom:0; width:2px; background:var(--pink); }
.nowline::before{ content:"now"; position:absolute; top:-1px; left:4px; font-size:10px; color:var(--pink); font-weight:600; }

/* films */
.fsearch{ display:flex; gap:8px; align-items:center; margin-top:12px; }
.fsearch input{ flex:1; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:10px 12px; font:inherit; }
.fbar{ display:flex; justify-content:space-between; align-items:center; margin:14px 0 8px; font-size:13px; color:var(--ink2); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px 12px; }
.fcard{ position:relative; cursor:pointer; }
.fcard .fb h3{ font:700 14.5px/1.2 var(--display); margin-top:7px; }
.fcard .meta{ font-size:12px; }
.fx{ font-size:11.5px; color:var(--ink2); margin:3px 0 0; }
.wl{ position:absolute; top:6px; right:6px; width:22px; height:22px; background:#fff; border-radius:50%; display:grid; place-items:center; }
.wl svg{ width:14px; height:14px; }

/* sheet */
.sheet{ position:fixed; inset:0; z-index:20; }
.scrim{ position:absolute; inset:0; background:rgba(10,12,40,.45); opacity:0; transition:opacity .2s; }
.panel{ position:absolute; left:0; right:0; bottom:0; max-height:92vh; max-height:92dvh; overflow-y:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:8px 18px calc(28px + env(safe-area-inset-bottom,0px)); transform:translateY(100%); transition:transform .22s ease-out; max-width:760px; margin:0 auto; }
.sheet.open .scrim{ opacity:1; } .sheet.open .panel{ transform:none; }
@media (prefers-reduced-motion: reduce){ .panel,.scrim{ transition:none; } }
.grab{ display:flex; justify-content:center; position:sticky; top:-8px; background:var(--bg); padding:6px 0 4px; z-index:1; }
.grab span{ width:40px; height:4px; border-radius:2px; background:var(--line); }
.closebtn{ position:absolute; right:0; top:2px; border:0; background:var(--surface2); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; }
.hero{ display:flex; gap:16px; align-items:flex-end; margin-top:10px; }
.hinfo{ min-width:0; flex:1; }
.hinfo h2{ font:800 26px/1.02 var(--display); letter-spacing:-0.02em; margin:8px 0 6px; }
.hsecs{ display:flex; flex-wrap:wrap; gap:5px; }
.sec{ border:0; background:color-mix(in srgb, var(--c) 14%, transparent); color:var(--c); font-size:11.5px; font-weight:600; border-radius:6px; padding:3px 7px; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sec{ color:color-mix(in srgb, var(--c) 45%, white); } }
.btn{ margin-top:10px; border:1.5px solid var(--pink); color:var(--pink); background:transparent; border-radius:999px; padding:7px 14px; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }
.btn svg{ width:14px; height:14px; } .btn svg path{ stroke:currentColor; stroke-width:3; }
.btn.on{ background:var(--pink); color:#fff; }
@media (max-width:420px){ .hero{ flex-direction:column; align-items:flex-start; } .poster.lg{ width:130px; } }
.sh{ font:700 17px/1.2 var(--display); margin:22px 0 8px; display:flex; gap:8px; align-items:baseline; }
.sh span{ font:500 12.5px var(--text); color:var(--ink2); }
.comp{ margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; }
.comp > b{ font-size:13px; color:var(--ink2); font-weight:600; }
.comp p{ margin:6px 0 0; font-size:12px; color:var(--ink2); }
.clink{ display:block; width:100%; text-align:left; border:0; background:transparent; padding:6px 0; font:700 15px/1.25 var(--display); }
.clink small{ display:block; font:400 12px var(--text); color:var(--ink2); }
.shows{ display:flex; flex-direction:column; gap:6px; }
.show{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.show > div{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; }
.show > div b{ width:100%; font-weight:600; }
.show.cur{ border-color:var(--blue); }
.show.past{ opacity:.5; }
.qa{ font-size:11.5px; color:var(--ink2); }
.addbtn{ border:1.5px solid var(--ink); background:transparent; border-radius:999px; padding:5px 14px; font-size:13px; font-weight:600; white-space:nowrap; }
.addbtn.on{ background:var(--pink); border-color:var(--pink); color:#fff; }
.links{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.links a{ text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; }
.links a b{ font-weight:600; font-size:14px; }
.links a span{ font-size:12px; color:var(--ink2); }
.secnote{ display:flex; gap:12px; align-items:flex-start; justify-content:space-between; border-left:4px solid var(--c); background:var(--surface); border-radius:0 12px 12px 0; padding:10px 12px; margin-bottom:8px; }
.secnote b{ font:700 15px var(--display); } .secnote p{ margin:3px 0 0; font-size:13px; color:var(--ink2); }
.secnote.big b{ font-size:22px; }
.x{ border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 10px; font-size:12px; white-space:nowrap; }
.minilist{ display:flex; flex-direction:column; gap:6px; }
.mrow{ display:flex; gap:10px; align-items:center; text-align:left; border:0; background:var(--surface); border-radius:12px; padding:8px; }
.mrow b{ display:block; font:700 14px/1.2 var(--display); } .mrow small{ color:var(--ink2); font-size:12px; }
.gt{ font:800 26px/1.05 var(--display); margin:12px 0 4px; }
.gg{ margin-top:16px; border-top:3px solid var(--c); padding-top:8px; }
.gg h3{ font:700 17px var(--display); color:var(--c); margin-bottom:4px; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gg h3{ color:color-mix(in srgb, var(--c) 45%, white); } }
.gs{ display:grid; grid-template-columns:1fr auto; gap:0 10px; width:100%; text-align:left; border:0; background:transparent; padding:8px 0; border-bottom:1px solid var(--line); }
.gs b{ font-weight:600; } .gs span{ grid-column:1; font-size:13px; color:var(--ink2); } .gs em{ grid-row:1; grid-column:2; font-style:normal; font-size:12px; color:var(--ink2); }

/* plan */
.pday{ margin-top:18px; }
.pitem{ display:flex; gap:12px; align-items:center; position:relative; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:4px 14px 14px 4px; padding:10px 44px 10px 12px; margin-bottom:8px; cursor:pointer; }
.ptime{ flex:0 0 74px; } .ptime b{ display:block; font:700 14px var(--display); } .ptime span{ font-size:11.5px; color:var(--ink2); }
.pbody h3{ font:700 15px/1.2 var(--display); margin-bottom:5px; }
.warn{ margin:-2px 0 8px 8px; font-size:12.5px; color:var(--warn); padding-left:10px; border-left:2px solid var(--warn); }
.warn.bad{ color:var(--bad); border-color:var(--bad); }
.banner{ background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); border-radius:12px; padding:10px 12px; font-weight:600; font-size:14px; margin-top:14px; }
.wrow{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:8px; }
.wt{ display:flex; gap:10px; align-items:center; cursor:pointer; } .wt h3{ font:700 15px/1.2 var(--display); }
.opts{ display:flex; gap:6px; overflow-x:auto; margin-top:8px; scrollbar-width:none; }
.opt{ flex:0 0 auto; border:1px dashed var(--ink2); background:transparent; border-radius:10px; padding:6px 10px; font-size:12.5px; font-weight:600; text-align:left; }
.opt small{ display:block; font-weight:400; color:var(--ink2); font-size:11px; }
.emptyplan{ text-align:center; padding:48px 20px; }
.emptyplan svg{ width:40px; height:40px; }
.emptyplan h3{ font:800 24px var(--display); margin:10px 0 6px; }
.emptyplan p{ color:var(--ink2); max-width:40ch; margin:0 auto; }
.emptyplan .btn{ margin-top:16px; }

/* around */
.area{ margin-bottom:14px; }
.ah{ margin:10px 0 6px; }
.ah .ven{ font-size:13px; }
.vrow{ display:flex; align-items:center; gap:10px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; }
.vrow div{ flex:1; min-width:0; } .vrow b{ display:block; font:700 15px var(--display); } .vrow span{ font-size:12px; color:var(--ink2); }
.vrow em{ font-style:normal; font-size:12px; color:var(--ink2); white-space:nowrap; }
.vrow i{ font-style:normal; font-size:12px; font-weight:600; color:var(--blue); }
.dist{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.dist div{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; }
.dist span{ font-size:12px; color:var(--ink2); } .dist b{ font:700 16px var(--display); }
.rk{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; }
.rk b{ font:700 15px var(--display); } .rk p{ margin:2px 0 0; font-size:13px; color:var(--ink2); }
.bus{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
.bhd b{ font:800 17px var(--display); margin-right:8px; } .bhd span{ font-size:13px; color:var(--ink2); }
.stops{ list-style:none; margin:10px 0 0; padding:0 0 0 14px; border-left:2px dashed var(--line); }
.stops li{ position:relative; font-size:13px; padding:3px 0; }
.stops li::before{ content:""; position:absolute; left:-20px; top:9px; width:8px; height:8px; border-radius:50%; background:var(--surface); border:2px solid var(--blue); }
.stops li.end{ font-weight:600; } .stops li.end::before{ background:var(--blue); }

/* bottom nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
.nav .in{ max-width:760px; margin:0 auto; display:flex; }
.nav button{ flex:1; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--ink2); padding:4px 0; position:relative; }
.nav button svg{ width:22px; height:22px; }
.nav button.on{ color:var(--pink); font-weight:600; }

const SMALL = new Set(['a','an','the','of','and','in','on','to','for','with','ka','ki','is','or','at','by','be','not']);
function tc(s){
  return s.split(' ').map((w,i,arr)=>{
    if(/[0-9]/.test(w) || /\..*\./.test(w)) return w;
    return w.split('-').map((p,j)=>{
      const low=p.toLowerCase();
      if(i>0 && j===0 && !/[:–]$/.test(arr[i-1]) && arr[i-1]!=='–' && SMALL.has(low.replace(/[^a-z]/g,''))) return low;
      const k = low.search(/[a-zà-ÿ]/i);
      return k<0?low:low.slice(0,k)+low.charAt(k).toUpperCase()+low.slice(k+1);
    }).join('-');
  }).join(' ');
}

/* Wikipedia summary for a film (loaded at runtime; text only) */
let filmWikiCache = null;
async function filmWiki(f){
  filmWikiCache = filmWikiCache || store.get('fwiki', {});
  if(f.id in filmWikiCache) return filmWikiCache[f.id];
  const base=f.t.replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim();
  const cands = [...(f.y?[`${base} (${f.y} film)`]:[]), `${base} (film)`, `${base} (TV series)`, base];
  for(const c of cands){
    try{
      const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(c.replace(/ /g,'_'))+'?redirect=true');
      if(r.status===404) continue;
      if(!r.ok) return null;
      const j=await r.json();
      if(j.type!=='standard') continue;
      const desc=(j.description||'')+' '+(j.extract||'').slice(0,300);
      if(!/\b(film|series|documentary|miniseries)\b/i.test(j.description||'')) continue;
      if(f.y && !new RegExp('\\b('+f.y+'|'+(+f.y-1)+'|'+(+f.y+1)+')\\b').test(desc)) continue;
      if(!f.y && !/(indian|india|hindi|tamil|telugu|malayalam|kannada|marathi|bengali|konkani|gujarati|assamese|odia)/i.test(desc)) continue;
      const v={x:j.extract, u:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page};
      filmWikiCache[f.id]=v; store.set('fwiki',filmWikiCache); return v;
    }catch(e){ return null; }
  }
  filmWikiCache[f.id]=0; store.set('fwiki',filmWikiCache); return 0;
}
async function fillFilmWiki(f){
  const el=document.getElementById('wikiabout'); if(!el) return;
  const v=await filmWiki(f);
  if(!el.isConnected || el.dataset.film!==f.id) return;
  if(v&&v.x){ el.innerHTML=`<h3 class="sh">About the film</h3><p class="wx">${esc(v.x)}</p><a class="credit" href="${v.u}" target="_blank" rel="noopener">From Wikipedia</a>`; el.hidden=false; }
}

/* ---------- photos (Wikipedia, loaded at runtime) ---------- */
const IMG_SKIP = new Set(['Sabu','Bapu','Rekhs']);
const WIKI_TITLE = {};
const ROLE_RE = /(director|filmmaker|film|actor|actress|singer|cinematographer|producer|screenwriter|critic|journalist|animator|writer|artist|casting|television|musician)/i;
const imgCache = store.get('imgs2', {});
const inflight = {};
function personImg(n){
  if(n in imgCache) return Promise.resolve(imgCache[n]);
  if(!PEOPLE[n] || IMG_SKIP.has(n)) return Promise.resolve(0);
  if(inflight[n]) return inflight[n];
  return inflight[n] = (async()=>{
    try{
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent((WIKI_TITLE[n]||n).replace(/ /g,'_'))+'?redirect=true');
      if(!r.ok){ if(r.status===404){ imgCache[n]=0; store.set('imgs2',imgCache); } return 0; }
      const j = await r.json();
      const ok = j.type==='standard' && j.thumbnail && ROLE_RE.test(j.description||'');
      const v = ok ? {src:j.thumbnail.source.replace(/\/(\d+)px-/,'/240px-'), page:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page} : 0;
      imgCache[n]=v; store.set('imgs2',imgCache); return v;
    }catch(e){ return 0; }
  })();
}
function hydrateAvatars(){
  document.querySelectorAll('[data-avatar]:not([data-done])').forEach(el=>{
    el.dataset.done='1';
    const n=el.dataset.avatar;
    personImg(n).then(v=>{
      if(!v||!v.src) return;
      const img=new Image(); img.alt=''; img.decoding='async';
      img.onload=()=>{ el.classList.add('hasimg'); el.appendChild(img);
        document.querySelectorAll('[data-credit]').forEach(c=>{ if(c.dataset.credit===n && v.page){ c.href=v.page; c.hidden=false; } }); };
      img.onerror=()=>{ imgCache[n]=0; store.set('imgs2',imgCache); };
      img.src=v.src;
    });
  });
}

function slotCard(s){

function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }

function renderSchedule(){
  renderDays(); renderFilters();
  const list=SLOTS.filter(s=>s.day===S.day && slotMatches(s));
  const films=list.filter(s=>s.type==='film').length, talks=list.filter(s=>s.type==='talk').length;
  const venues=new Set(list.map(s=>s.v)).size;
  $('#daysum').innerHTML = `<b>${dayLabel(S.day)}</b> <span>${films} screening${films===1?'':'s'}</span><span>${venues} venue${venues===1?'':'s'}</span>${talks?`<span>${talks} talk${talks>1?'s':''}</span>`:''}`;
  const out=$('#sched');
  if(!list.length){ out.innerHTML=`<p class="empty">Nothing matches on this day. Try another area or section.</p>`; return; }
  if(S.view==='list'){
    const parts={Morning:[],Afternoon:[],Evening:[]};
    list.forEach(s=>parts[s.start<12*60?'Morning':s.start<17*60?'Afternoon':'Evening'].push(s));
    out.innerHTML = Object.entries(parts).filter(([,a])=>a.length).map(([k,a])=>
      `<section class="block"><h2 class="bh">${k}<span>${a.length}</span></h2>${a.map(slotCard).join('')}</section>`).join('');
  } else {
    renderTimeline(list,out);
  }
}

function renderTimeline(list,out){
  const PX=1.5, T0=9*60, T1=24*60;
  const vs=VENUE_ORDER.filter(v=>list.some(s=>s.v===v));
  const W=(T1-T0)*PX;
  let hours=''; for(let h=9;h<=23;h++){ hours+=`<span style="left:${(h*60-T0)*PX}px">${h%12||12}${h<12?'a':'p'}</span>`; }
  const rows=vs.map(v=>{
    const blocks=list.filter(s=>s.v===v).map(s=>{
      const l=(s.start-T0)*PX, w=Math.max(28,(s.end-s.start)*PX-3);
      const label= s.type==='film'? s.ids.map(i=>FILMS[i].t).join(' + ') : s.title;
      const on=S.plan.has(s.key);
      const attr = s.type==='film'?`data-film="${s.ids[s.ids.length-1]}" data-slot="${s.key}"`:s.type==='talk'?`data-talk="${s.key}"`:`data-pin="${s.key}"`;
      return `<button class="blk ${on?'on':''} ${s.type}" ${attr} style="left:${l}px;width:${w}px;--c:${slotColor(s)}" title="${esc(label)}">
        <b>${esc(label)}</b><span>${fmtShort(s.start)}–${fmtShort(s.end)}</span></button>`;
    }).join('');
    return `<div class="trow"><div class="tlab"><b>${esc(VENUES[v].name)}</b><span>${esc(VENUES[v].sub)}</span></div><div class="tlane" style="width:${W}px">${blocks}</div></div>`;
  }).join('');
  const now = S.day===TODAY && nowMin()>T0 && nowMin()<T1 ? `<div class="nowline" style="left:${(nowMin()-T0)*PX}px"></div>`:'';
  out.innerHTML = `<p class="hint">Scroll sideways. Each bar is a screening; tap one for details. Starred bars are in your plan.</p>
  <div class="tl"><div class="tlscroll"><div class="thead"><div class="tlab"></div><div class="hours" style="width:${W}px">${hours}</div></div>
  <div class="tbody" style="--w:${W}px">${rows}<div class="nowwrap" style="width:${W}px">${now}</div></div></div></div>`;
  if(S.day===TODAY){ const sc=out.querySelector('.tlscroll'); sc.scrollLeft=Math.max(0,(nowMin()-T0)*PX-120); }
}

  }).join('') : `<p class="empty">No films match “${esc(S.fq)}”. Try a director, country or language.</p>`;

/* ---------- plan ---------- */
function renderPlan(){
  const picked=[...S.plan].map(k=>SLOT_BY_KEY[k]).filter(Boolean).sort((a,b)=>a.day-b.day||a.start-b.start);
  $('#planbadge').textContent = picked.length||'';
  $('#planbadge').hidden = !picked.length;
  const out=$('#plan');
  let html='';
  if(!picked.length && !S.watch.size){
    out.innerHTML=`<div class="emptyplan">${STAR('var(--pink)')}<h3>Build your festival</h3><p>Tap the star on any screening or talk to add it here. Use “Want to watch” on a film to shortlist it, then pick the showing that fits.</p><button class="btn" data-goto="schedule">Browse today’s schedule</button></div>`;
    return;
  }
  const byDay={}; picked.forEach(s=>(byDay[s.day]=byDay[s.day]||[]).push(s));
  let clashes=0;
  html+=Object.entries(byDay).map(([d,arr])=>{
    let mins=0;
    const items=arr.map((s,i)=>{
      mins+=s.end-s.start;
      let warn='';
      const prev=arr[i-1];
      if(prev){
        const gap=s.start-prev.end, need=travel(VENUES[prev.v].area,VENUES[s.v].area);
        if(gap<0){ warn=`<p class="warn bad">Clashes with the previous pick by ${-gap} min</p>`; clashes++; }
        else if(gap<need){ warn=`<p class="warn">Only ${gap} min to get from ${VENUES[prev.v].name} to ${VENUES[s.v].name}. Allow about ${need}.</p>`; }
      }
      const title = s.type==='film'? s.ids.map(i=>FILMS[i].t).join(' + ') : s.title;
      return `${warn}<div class="pitem" style="--c:${slotColor(s)}" ${s.type==='film'?`data-film="${s.ids[s.ids.length-1]}" data-slot="${s.key}" tabindex="0"`:s.type==='talk'?`data-talk="${s.key}" tabindex="0"`:''}>
        <div class="ptime"><b>${fmt(s.start)}</b><span>to ${fmt(s.end)}</span></div>
        <div class="pbody"><h3>${esc(title)}</h3><span class="ven" data-area="${VENUES[s.v].area}">${esc(vlabel(s.v))}</span>${S.base&&(!prev||VENUES[prev.v].area!==VENUES[s.v].area)?`<span class="lb">${prev?'Head over':'Leave'} by ${fmt(prev?s.start-travel(VENUES[prev.v].area,VENUES[s.v].area)-15:leaveBy(s).t)}</span>`:''}</div>
        <button class="pin on" data-pin="${s.key}" aria-label="Remove from my plan">${STAR('var(--pink)')}</button></div>`;
    }).join('');
    return `<section class="pday"><h2 class="bh">${dayLabel(+d)}<span>${Math.round(mins/6)/10} h of cinema</span></h2>${items}</section>`;
  }).join('');
  const unplanned=[...S.watch].map(id=>FILMS[id]).filter(f=>f&&!f.shows.some(s=>S.plan.has(s.key)));
  if(unplanned.length){
    html+=`<section class="pday"><h2 class="bh">Want to watch, not scheduled yet<span>${unplanned.length}</span></h2>
    ${unplanned.map(f=>`<div class="wrow"><div class="wt" data-film="${f.id}" tabindex="0">${poster(f,'sm')}<h3>${esc(f.t)}</h3></div>
      <div class="opts">${f.shows.map(s=>`<button class="opt" data-pin="${s.key}">${DAYS[s.day].w} ${DAYS[s.day].n}, ${fmt(s.start)}<small>${esc(vlabel(s.v))}</small></button>`).join('')}</div></div>`).join('')}</section>`;
  }
  out.innerHTML=`<div class="planbar">${baseSelect()}<span class="muted">Used for “leave by” times.</span></div>`+(clashes?`<p class="banner">${clashes} clash${clashes>1?'es':''} in your plan. Look for the red notes.</p>`:'')+html;
}

  $('#sheetbody').innerHTML=`<div class="secnote big" style="--c:${GROUPS[x.g].c}"><div><b id="sheettitle">${esc(x.n)}</b><p>${esc(x.d)}</p></div></div>
  <h3 class="sh">${list.length} films</h3>
  <div class="minilist">${list.map(f=>`<button class="mrow" data-film="${f.id}">${poster(f,'sm')}<span><b>${esc(f.t)}</b><small>${esc(f.d)}</small></span></button>`).join('')}</div>`;
  openSheet();
}
function openPerson(n){
  $('#sheetbody').innerHTML = personBlock(n,null,true);
  openSheet();
}
function openTalk(key){
  const s=SLOT_BY_KEY[key]; if(!s) return;
  const on=S.plan.has(key);
  $('#sheetbody').innerHTML = `<div class="talkhero"><span class="kindtag">${esc(s.kind)}</span>
    <h2 id="sheettitle">${esc(s.title)}</h2>
    <p class="meta big"><span>${dayLabel(s.day)}</span><span>${fmt(s.start)} to ${fmt(s.end)}</span><span>Kala Academy, Campal</span></p>
    ${TALK_NOTES[key]?`<p class="note">${esc(TALK_NOTES[key])}</p>`:''}
    ${S.base?`<p class="meta big"><span>Leave ${esc(BASES[S.base])} by <b>${fmt(leaveBy(s).t)}</b></span></p>`:''}
    <div class="bookrow"><button class="btn ${on?'on':''}" data-pin="${key}" data-refresh-talk="${key}">${STAR(on?'#fff':'none')} ${on?'In your plan':'Add to my plan'}</button>
    <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${enc(VENUES.KA.q)}" target="_blank" rel="noopener">Map</a></div></div>
    ${s.sp?`<h3 class="sh">${splitNames(s.sp).length>1?'Speakers':'Speaker'}</h3>${splitNames(s.sp).map(n=>personBlock(n,null,false)).join('')}`:'<p class="lede">The festival hasn’t listed this session’s details in the printed schedule. Check the website or app.</p>'}
    ${s.mod?`<h3 class="sh">Moderator</h3>${splitNames(s.mod).map(n=>personBlock(n,null,false)).join('')}`:''}
    ${bookingBox('talk')}`;
  openSheet();
}
let lastFocus=null;
function openSheet(){ lastFocus=document.activeElement; const d=$('#sheet'); d.hidden=false; requestAnimationFrame(()=>d.classList.add('open')); $('#sheetpanel').scrollTop=0; $('#sheetclose').focus(); document.body.style.overflow='hidden'; }
function closeSheet(){ const d=$('#sheet'); d.classList.remove('open'); setTimeout(()=>{d.hidden=true;},220); document.body.style.overflow=''; if(lastFocus) lastFocus.focus?.(); }

function openGuide(){
  $('#sheetbody').innerHTML=`<h2 id="sheettitle" class="gt">How IFFI is put together</h2>
  <p class="lede">Every film belongs to a section. Sections are grouped below by colour, and the same colours run through the schedule, the timeline and your plan.</p>
  ${Object.entries(GROUPS).map(([k,g])=>{ const secs=Object.entries(SECTIONS).filter(([,s])=>s.g===k);
    return `<div class="gg" style="--c:${g.c}"><h3>${g.name}</h3>${secs.map(([code,s])=>{ const n=Object.values(FILMS).filter(f=>f.secs.includes(code)).length;
      return `<button class="gs" data-sec="${code}"><b>${esc(s.n)}</b><span>${esc(s.d)}</span><em>${n||'–'} film${n===1?'':'s'}</em></button>`;}).join('')}</div>`;}).join('')}`;
  openSheet();
}

/* ---------- events ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.hidden=t.id!=='tab-'+S.tab);
  document.querySelectorAll('[data-tab]').forEach(b=>{ b.classList.toggle('on',b.dataset.tab===S.tab); b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'); });
  if(S.tab==='schedule') renderSchedule();
  if(S.tab==='films') renderFilms();
  if(S.tab==='talks') renderTalks();
  if(S.tab==='around') renderAround();
  renderPlan();
}
function togglePin(k){ S.plan.has(k)?S.plan.delete(k):S.plan.add(k); savePlan(); }

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-film],[data-tab],[data-talk]'); if(!t) return;
  if(t.tagName==='A') return;
  const d=t.dataset;
  if(d.tab){ S.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.goto){ S.tab=d.goto; render(); return; }
  if(d.day){ S.day=+d.day; renderSchedule(); return; }
  if(d.view){ S.view=d.view; store.set('view',S.view); renderSchedule(); return; }
  if(d.area){ S.area=d.area; renderSchedule(); return; }
  if(d.group){ S.group=d.group; renderSchedule(); return; }
  if(d.fgroup){ S.fgroup=d.fgroup; S.fsec=null; renderFilms(); return; }
  if(d.fsort){ S.fsort=d.fsort; renderFilms(); return; }
  if('clearsec' in d){ S.fsec=null; renderFilms(); return; }
  if(d.refreshTalk){ togglePin(d.pin); openTalk(d.refreshTalk); render(); return; }
  if(d.person){ openPerson(d.person); return; }
  if(d.pin){ e.stopPropagation(); togglePin(d.pin);
    if(!$('#sheet').hidden && t.classList.contains('addbtn')){ const on=S.plan.has(d.pin); t.classList.toggle('on',on); t.textContent=on?'In plan':'Add'; }
    render(); return; }
  if(d.watch){ S.watch.has(d.watch)?S.watch.delete(d.watch):S.watch.add(d.watch); saveWatch(); openFilm(d.watch, null); render(); return; }
  if(d.browse){ closeSheet(); S.tab='films'; S.fgroup='all'; S.fsec=d.browse; S.fq=''; $('#fq').value=''; render(); window.scrollTo(0,0); return; }
  if(d.sec){ openSecSheet(d.sec); return; }
  if('guide' in d){ openGuide(); return; }
  if(d.film){ openFilm(d.film, d.slot||t.closest('[data-slot]')?.dataset.slot); return; }
  if(d.talk){ openTalk(d.talk); return; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !$('#sheet').hidden) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-film][tabindex],[data-talk][tabindex]')){ e.preventDefault(); e.target.click(); }
});
$('#sheetclose').addEventListener('click',closeSheet);
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('change',e=>{
  if(e.target.matches('[data-base]')){
    S.base=e.target.value; store.set('base',S.base);
    const t=document.getElementById('sheettitle');
    if(!$('#sheet').hidden){ const w=document.getElementById('wikiabout'); if(w) openFilm(w.dataset.film, $('.show.cur')?.querySelector('[data-pin]')?.dataset.pin); }
    renderPlan();
  }
});
$('#fq').addEventListener('input',e=>{ S.fq=e.target.value; renderFilms(); });

render();
setInterval(()=>{ if(S.tab==='schedule' && S.day===TODAY) renderSchedule(); }, 60000);
</script></body></html>
